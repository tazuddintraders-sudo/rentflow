{% if messages %}
  <script>
    window.__django_messages = [
      {% for message in messages %}
        {
          "type": "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}",
          "title": "{% if message.tags == 'error' %}Something needs attention{% elif message.tags == 'success' %}Done{% elif message.tags == 'warning' %}Heads up{% else %}Note{% endif %}",
          "text": "{{ message|escapejs }}"
        }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ];
  </script>
{% endif %}
